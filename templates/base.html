<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <title>{% block title %}VizGov{% endblock %}</title>
  {% block head %}{% endblock %}
</head>

<body>

  <!-- ================================================================
       NAVBAR
  ================================================================ -->
  <header>
    <div class="px-3 py-2 text-bg-dark border-bottom">
      <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between">

          <a href="{{ url_for('home') }}" class="d-flex align-items-center text-white text-decoration-none">
            <!-- <i class="bi bi-currency-dollar fs-3 ms-1"></i> -->
            <h2 class="mb-0 text-white">VizGov</h2>
          </a>

          <ul class="nav my-2 text-small">
            <li>
              <a href="{{ url_for('home') }}"
                 class="nav-link text-center {% if active_page == 'home' %}text-secondary{% else %}text-white{% endif %}">
                Início
              </a>
            </li>
            <li>
              <a href="{{ url_for('revenues') }}"
                 class="nav-link text-center {% if active_page == 'receitas' %}text-secondary{% else %}text-white{% endif %}">
                Receitas
              </a>
            </li>
            <li>
              <a href="{{ url_for('expenses') }}"
                 class="nav-link text-center {% if active_page == 'despesas' %}text-secondary{% else %}text-white{% endif %}">
                Despesas
              </a>
            </li>
            <li>
              <a href="{{ url_for('about') }}"
                 class="text-decoration-none ms-2 {% if active_page == 'about' %}text-secondary{% else %}text-white{% endif %}"
                 title="Sobre">
                <i class="bi bi-question-lg fs-4"></i>
              </a>
            </li>
          </ul>

        </div>
      </div>
    </div>
  </header>

  <!-- ================================================================
       PAGE CONTENT
  ================================================================ -->
  {% block content %}{% endblock %}

  <!-- ================================================================
       FOOTER
  ================================================================ -->
  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top border-secondary bg-dark text-white px-4">
    <p class="col-md-4 mb-0 text-white-50">© {{ current_year }} JpeBecker</p>

    <a href="{{ url_for('home') }}"
       class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 text-white text-decoration-none">
       <i class="bi bi-currency-dollar fs-3 ms-1"></i>
    </a>

    <ul class="nav col-md-4 justify-content-end">
      <li class="nav-item"><a href="{{ url_for('home') }}"  class="nav-link px-2 text-white">Início</a></li>
      <li class="nav-item"><a href="{{ url_for('about') }}" class="nav-link px-2 text-white">Sobre</a></li>
    </ul>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
  {% block scripts %}{% endblock %}

</body>
</html>
